type: object
description: |
  OpenID Connect Discovery応答。
  各ビルOSベンダーの認可サーバーが返すべき設定情報。
  RFC 8414 (OAuth 2.0 Authorization Server Metadata) および
  OpenID Connect Discovery 1.0 に準拠する。
required:
  - issuer
  - authorization_endpoint
  - token_endpoint
  - revocation_endpoint
  - jwks_uri
  - response_types_supported
  - subject_types_supported
  - id_token_signing_alg_values_supported
  - scopes_supported
  - grant_types_supported
properties:
  issuer:
    type: string
    format: uri
    description: 認可サーバーの識別子（Issuer Identifier）
    example: https://auth.example.com
  authorization_endpoint:
    type: string
    format: uri
    description: OAuth 2.0 認可エンドポイント
    example: https://auth.example.com/authorize
  token_endpoint:
    type: string
    format: uri
    description: OAuth 2.0 トークンエンドポイント
    example: https://auth.example.com/token
  revocation_endpoint:
    type: string
    format: uri
    description: |
      OAuth 2.0 トークン失効エンドポイント（RFC 7009）。
      クライアントアプリの不具合によるビル設備の誤制御など、
      緊急時にトークンを即座に失効させるために使用する。
    example: https://auth.example.com/revoke
  jwks_uri:
    type: string
    format: uri
    description: JSON Web Key Set（公開鍵セット）のURI。リソースサーバーがトークン署名を検証するために使用する。
    example: https://auth.example.com/.well-known/jwks.json
  scopes_supported:
    type: array
    description: |
      サポートするOAuth 2.0スコープの一覧。
      スマートビル標準APIでは、以下のスコープへの対応を必須とする。
    items:
      type: string
    example:
      - openid
      - profile
      - digital-twins:read
      - digital-twins:write
      - devices:read
      - devices:control
      - tasks:read
      - tasks:write
      - log:read
  response_types_supported:
    type: array
    description: サポートするOAuth 2.0レスポンスタイプ
    items:
      type: string
    example:
      - code
  grant_types_supported:
    type: array
    description: |
      サポートするOAuth 2.0グラントタイプ。
      authorization_code（ユーザー向けアプリ）と
      client_credentials（M2M連携）の両方への対応を必須とする。
    items:
      type: string
    example:
      - authorization_code
      - client_credentials
      - refresh_token
  subject_types_supported:
    type: array
    description: サポートするサブジェクトタイプ
    items:
      type: string
    example:
      - public
  id_token_signing_alg_values_supported:
    type: array
    description: IDトークンの署名アルゴリズム
    items:
      type: string
    example:
      - RS256
  token_endpoint_auth_methods_supported:
    type: array
    description: トークンエンドポイントの認証方式
    items:
      type: string
    example:
      - client_secret_basic
      - client_secret_post
  code_challenge_methods_supported:
    type: array
    description: |
      PKCEのコードチャレンジ方式（RFC 8414で定義）。
      OIDC Discovery 1.0の仕様外だが、主要な認可サーバーが広くサポートしており、
      本標準ではAuthorization Codeフローに対してPKCE（S256）の使用を必須とするため含める。
    items:
      type: string
    example:
      - S256
