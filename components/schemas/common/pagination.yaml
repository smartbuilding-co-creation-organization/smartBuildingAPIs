type: object
properties:
  page:
    type: integer
    description: 現在のページ番号
    minimum: 1
    example: 1
  pageSize:
    type: integer
    description: 1ページあたりの件数
    minimum: 1
    maximum: 100
    example: 20
  total:
    type: integer
    description: 総件数
    example: 100
  totalPages:
    type: integer
    description: 総ページ数
    example: 5