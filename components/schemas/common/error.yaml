type: object
required:
  - code
  - message
properties:
  code:
    type: string
    description: エラーコード
    example: INVALID_REQUEST
  message:
    type: string
    description: エラーメッセージ
    example: リクエストパラメータが不正です
  details:
    type: array
    description: 詳細エラー情報
    items:
      type: object
      properties:
        field:
          type: string
          example: userId
        issue:
          type: string
          example: 必須フィールドです
  timestamp:
    type: string
    format: date-time
    description: エラー発生時刻