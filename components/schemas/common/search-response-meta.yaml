type: object
required:
  - total
  - page
  - pageSize
  - totalPages
description: 検索レスポンスのメタ情報
properties:
  total:
    type: integer
    description: 総件数
    example: 100
  page:
    type: integer
    description: 現在のページ番号
    example: 1
  pageSize:
    type: integer
    description: 1ページあたりの件数
    minimum: 1
    maximum: 100
    example: 20
  totalPages:
    type: integer
    description: 総ページ数
    example: 5