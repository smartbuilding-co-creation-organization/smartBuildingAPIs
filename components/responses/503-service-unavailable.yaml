description: サービスが一時的に利用できません
headers:
  Request-Id:
    $ref: '../headers/request-id.yaml'
  Date:
    $ref: '../headers/date.yaml'
  Retry-After:
    description: 再試行可能になるまでの秒数
    schema:
      type: integer
      example: 300
content:
  application/json:
    schema:
      $ref: '../schemas/common/error.yaml'
    example:
      code: SERVICE_UNAVAILABLE
      message: サービスは現在メンテナンス中です
      timestamp: '2024-01-15T10:30:00Z'